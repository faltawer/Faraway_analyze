<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faraway</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap');

        :root {
            --gold: #c9a84c;
            --gold2: #e8c97a;
            --dark: #0e0c0a;
            --surface: #1a1612;
            --card-bg: #221e18;
            --border: #3a3020;
            --text: #e8dfc8;
            --muted: #7a6e58;
            --green: #4a8c5c;
            --purple: #6a4a8c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--dark);
            color: var(--text);
            font-family: 'Crimson Pro', Georgia, serif;
            min-height: 100vh;
        }

        /* ── Layout ── */
        .wrap {
            max-width: 1300px;
            margin: 0 auto;
            padding: 16px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 18px;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 4px;
        }

        .rndbg {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 2px;
        }

        .scrbg {
            font-family: 'Cinzel', serif;
            font-size: 17px;
            color: var(--gold2);
            font-weight: 600;
        }

        #msg {
            text-align: center;
            padding: 9px 18px;
            margin-bottom: 14px;
            border-radius: 6px;
            font-size: 14px;
            font-style: italic;
            min-height: 38px;
            transition: all .25s;
        }

        #msg.c-gold {
            background: rgba(201, 168, 76, .10);
            border: 1px solid rgba(201, 168, 76, .28);
            color: var(--gold2);
        }

        #msg.c-purple {
            background: rgba(106, 74, 140, .10);
            border: 1px solid rgba(106, 74, 140, .28);
            color: #c4a0e8;
        }

        #msg.c-green {
            background: rgba(74, 140, 92, .10);
            border: 1px solid rgba(74, 140, 92, .28);
            color: #7ad4a0;
        }

        #msg.c-blue {
            background: rgba(58, 90, 140, .10);
            border: 1px solid rgba(58, 90, 140, .28);
            color: #7a9fd4;
        }

        .stitle {
            font-family: 'Cinzel', serif;
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, var(--border), transparent);
            margin: 14px 0;
        }

        /* ── Opponents ── */
        .opponents {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .opp {
            flex: 1;
            min-width: 180px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
        }

        .opp-name {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            color: var(--gold);
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .mini-row {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }

        .mini {
            width: 70px;
            height: 70px;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            flex-shrink: 0;
        }
        .mini-sanctuaries {
            width: 48px;
            height: 70px;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            flex-shrink: 0;
        }

        /* Ajoutez cette règle pour l'image à l'intérieur */
        .mini-sanctuaries img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* ou 'contain' si vous préférez éviter la déformation */
            object-position: center; /* centre l'image */
}
        .mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: .8;
        }

        .mini span {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, .72);
            font-size: 7px;
            text-align: center;
            color: var(--gold2);
            padding: 1px 0;
        }

        /* ── Tableau ── */
        #my-tableau.cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 150px); /* 4 colonnes de 120px */
            gap: 7px;
            justify-content: left; /* Centre la grille si moins de 4 cartes par ligne */
        }

        .tableau {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            min-height: 76px;
            padding: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .t-empty {
            color: var(--muted);
            font-style: italic;
            font-size: 13px;
            align-self: center;
            margin: auto;
        }

        .sanct-lbl {
            font-family: 'Cinzel', serif;
            font-size: 8px;
            letter-spacing: 2px;
            color: #7ad4a0;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .sanct-row {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        /* ── Cards ── */
        .card {
            position: relative;
            border-radius: 5px;
            overflow: hidden;
            border: 1.5px solid var(--border);
            transition: transform .13s, border-color .13s, box-shadow .13s;
            cursor: default;
        }

        .card img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card .cscore {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: rgba(0, 0, 0, .82);
            color: var(--gold2);
            font-size: 10px;
            font-family: 'Cinzel', serif;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .card .tip {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%) translateY(3px);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 7px 9px;
            font-size: 10px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity .13s, transform .13s;
            pointer-events: none;
            z-index: 200;
            min-width: 110px;
        }

        .card:hover .tip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .tip .tp {
            color: var(--gold2);
            font-family: 'Cinzel', serif;
            font-size: 12px;
            margin-bottom: 3px;
        }

        .tip .tl {
            color: var(--muted);
            font-size: 9px;
            margin-top: 2px;
        }

        .tip .tr {
            color: #e88;
        }

        .tip .te {
            color: #8e8;
        }

        .card.playable {
            cursor: pointer;
            border-color: rgba(201, 168, 76, .45);
        }

        .card.playable:hover {
            transform: translateY(-7px) scale(1.04);
            border-color: var(--gold);
            box-shadow: 0 10px 26px rgba(201, 168, 76, .22), 0 0 0 1px var(--gold);
            z-index: 10;
        }

        .card.c-pick {
            cursor: pointer;
            border-color: rgba(106, 74, 140, .5);
            animation: pp 1.5s ease-in-out infinite;
        }

        .card.c-pick:hover {
            transform: translateY(-7px) scale(1.04);
            border-color: var(--purple);
            box-shadow: 0 10px 24px rgba(106, 74, 140, .28);
            z-index: 10;
        }

        @keyframes pp {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(106, 74, 140, .28)
            }
            50% {
                box-shadow: 0 0 0 4px rgba(106, 74, 140, .12)
            }
        }

        .card.s-pick {
            cursor: pointer;
            border-color: rgba(74, 140, 92, .5);
            animation: gp 1.5s ease-in-out infinite;
        }

        .card.s-pick:hover {
            transform: translateY(-6px) scale(1.04);
            border-color: var(--green);
            box-shadow: 0 10px 22px rgba(74, 140, 92, .26);
            z-index: 10;
        }

        @keyframes gp {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(74, 140, 92, .28)
            }
            50% {
                box-shadow: 0 0 0 4px rgba(74, 140, 92, .12)
            }
        }

        /* ── Center / Sanctuary areas ── */
        .zone {
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 8px;
        }
.voyage-zone {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column; /* Empile les éléments verticalement */
    gap: 10px; /* Espace entre les sanctuaires et le tableau */
}

.voyage-zone .tableau {
    min-height: 76px;
    padding: 8px;
    background: rgba(0, 0, 0, 0.1); /* Fond légèrement différent pour le tableau */
    border-radius: 5px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}
        .zone.z-center {
            background: rgba(106, 74, 140, .06);
            border: 1px solid rgba(106, 74, 140, .22);
        }

        .zone.z-sanct {
            background: rgba(74, 140, 92, .06);
            border: 1px solid rgba(74, 140, 92, .22);
        }

        .zone.z-center .stitle {
            color: #c4a0e8;
        }

        .zone.z-sanct .stitle {
            color: #7ad4a0;
        }

        .zone-cards {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ── Hand ── */
        .hand-area {
            margin-bottom: 18px;
        }

        .hand-cards {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .thinking::after {
            content: '';
            animation: dots 1.1s steps(4, end) infinite;
        }

        @keyframes dots {
            0% {
                content: ''
            }
            25% {
                content: '.'
            }
            50% {
                content: '..'
            }
            75% {
                content: '...'
            }
            100% {
                content: ''
            }
        }

        /* ================================================================
           FINAL PANEL — panneau latéral glissant
           ================================================================ */
        #final-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: min(760px, 100vw);
            height: 100vh;
            background: var(--surface);
            border-left: 1px solid var(--gold);
            z-index: 500;
            overflow-y: auto;
            transition: right .35s cubic-bezier(.4, 0, .2, 1);
            padding: 28px 24px 50px;
        }

        #final-panel.open {
            right: 0;
        }

        /* Bouton fermer */
        #btn-close-final {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            background: rgba(201, 168, 76, .15);
            border: 1px solid rgba(201, 168, 76, .35);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold2);
            font-size: 18px;
            font-family: monospace;
            transition: background .2s;
        }

        #btn-close-final:hover {
            background: rgba(201, 168, 76, .28);
        }

        /* Bouton ouvrir résultats (visible en jeu) */
        #btn-show-final {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 400;
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--dark);
            background: var(--gold);
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            cursor: pointer;
            transition: background .2s;
        }

        #btn-show-final.visible {
            display: block;
        }

        #btn-show-final:hover {
            background: var(--gold2);
        }

        .fp-title {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            color: var(--gold);
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Podium */
        .podium {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .pod {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 20px;
            text-align: center;
            min-width: 120px;
        }

        .pod.gold-pod {
            border-color: var(--gold);
            background: rgba(201, 168, 76, .07);
        }

        .pod-rank {
            font-family: 'Cinzel', serif;
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 2px;
            margin-bottom: 3px;
        }

        .pod-name {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: var(--text);
        }

        .pod.gold-pod .pod-name {
            color: var(--gold2);
        }

        .pod-score {
            font-size: 20px;
            color: var(--gold2);
            margin-top: 2px;
        }

        /* Player blocks */
        .fp-player {
            margin-bottom: 22px;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .fp-player.fp-winner {
            border-color: var(--gold);
        }

        .fp-player-hd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 16px;
            background: rgba(255, 255, 255, .02);
            border-bottom: 1px solid var(--border);
        }

        .fp-player-hd .pname {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            color: var(--text);
            letter-spacing: 1px;
        }

        .fp-player.fp-winner .pname {
            color: var(--gold2);
        }

        .fp-player-hd .pscore {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            color: var(--gold2);
        }

        .fp-body {
            padding: 14px 16px;
        }

        /* Sanctuaires finaux */
        .fp-sanct-lbl {
            font-family: 'Cinzel', serif;
            font-size: 8px;
            letter-spacing: 2px;
            color: #7ad4a0;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .fp-sanct-row {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        /* Grille 4×2 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
        }

        .cards-grid .card {
            width: 100%;
            aspect-ratio: 4/4;
        }

        .fp-replay {
            display: block;
            width: 100%;
            margin-top: 24px;
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--dark);
            background: var(--gold);
            border: none;
            border-radius: 6px;
            padding: 11px;
            cursor: pointer;
            transition: background .2s;
        }

        .fp-replay:hover {
            background: var(--gold2);
        }
    </style>
</head>
<body>
<div class="wrap">

    <header>
        <div class="logo">Faraway</div>
        <div id="round-label" class="rndbg">TOUR — / 8</div>
        <div id="score-label" class="scrbg">0 pts</div>
    </header>

    <div id="msg" class="c-blue">Chargement...</div>

    <div class="stitle">Adversaires</div>
    <div class="opponents" id="opponents"></div>

    <div class="divider"></div>


    <div class="zone z-center">
        <div class="stitle">Centre</div>
        <div class="zone-cards" id="center-cards"></div>
    </div>


<!--    <div id="my-sanct-row" style="display:none;margin-bottom:8px;">-->
<!--&lt;!&ndash;        <div class="sanct-lbl">✦ Sanctuaires</div>&ndash;&gt;-->
<!--        <div class="sanct-row" id="my-sanctuaries"></div>-->
<!--    </div>-->

<!--    <div class="tableau" id="my-tableau">-->
<!--        <span class="t-empty">Vos cartes apparaîtront ici…</span>-->
<!--    </div>-->
    <div class="voyage-zone" id="my-voyage-zone">
    <!-- Zone des sanctuaires -->
    <div id="my-sanct-row" style="display:none;margin-bottom:8px;">
        <div class="sanct-lbl">✦ Sanctuaires</div>
        <div class="sanct-row" id="my-sanctuaries"></div>
    </div>

    <!-- Zone du tableau (cartes jouées) -->
    <div class="tableau" id="my-tableau">
        <span class="t-empty">Vos cartes apparaîtront ici…</span>
    </div>
</div>


    <div class="zone z-sanct" id="sanct-zone" style="display:none;">
        <div class="stitle">Choisir un sanctuaire</div>
        <div class="zone-cards" id="sanct-cards"></div>
    </div>

    <div class="hand-area">
        <div class="stitle">Ma main</div>
        <div class="hand-cards" id="hand-cards"></div>
    </div>

</div>

<!-- Bouton flottant pour revoir les résultats -->
<button id="btn-show-final" onclick="openFinal()">Voir les résultats</button>

<!-- Panneau résultats -->
<div id="final-panel">
    <button id="btn-close-final" onclick="closeFinal()" title="Fermer">✕</button>
    <div class="fp-title">✦ Fin du voyage ✦</div>
    <div class="podium" id="podium"></div>
    <div id="fp-players"></div>
    <button class="fp-replay" onclick="location.reload()">Nouvelle partie</button>
</div>

<script>
    let lastPhase = null;

    /* ── Helpers ── */
    function tip(c) {
        const r = c.requirements.length ? `<div class="tl tr">reqs: ${c.requirements.join(', ')}</div>` : '';
        const e = c.effect.length ? `<div class="tl te">effet: ${c.effect.join(', ')}</div>` : '';
        const col = c.color ? `<div class="tl">couleur: ${c.color}</div>` : '';
        return `<div class="tip"><div class="tp">${c.points} pts — #${c.id}</div>${r}${e}${col}</div>`;
    }

    function cardHTML(c, cls, fn) {
        const sc = c.score != null ? `<div class="cscore">${c.score} pts</div>` : '';
        const cl = fn ? `onclick="${fn}(${c.id})"` : '';
        return `<div class="card ${cls}" style="width:100%;height:100%;" ${cl}>
    <img src="/card_image/${c.id}" alt="${c.id}"
         onerror="this.style.background='#2a2318';this.removeAttribute('src')">
    ${sc}${tip(c)}
  </div>`;
    }

    function miniHTML(c) {
        const sc = c.score != null ? `<span>${c.score}p</span>` : '';
        return `<div class="mini" title="#${c.id} ${c.points}pts">
    <img src="/card_image/${c.id}" alt="${c.id}"
         onerror="this.style.background='#2a2318';this.removeAttribute('src')">
    ${sc}
  </div>`;
    }
    function minisanctuariesHTML(c) {
        const sc = c.score != null ? `<span>${c.score}p</span>` : '';
        return `<div class="mini-sanctuaries" title="#${c.id} ${c.points}pts">
    <img src="/card_image/${c.id}" alt="${c.id}"
         onerror="this.style.background='#2a2318';this.removeAttribute('src')">
    ${sc}
  </div>`;
 }
    /* ── Actions ── */
    async function playCard(id) {
        await fetch(`/api/play_card/${id}`, {method: 'POST'});
    }

    async function pickCenter(id) {
        await fetch(`/api/pick_center/${id}`, {method: 'POST'});
    }

    async function pickSanctuary(id) {
        await fetch(`/api/pick_sanctuary/${id}`, {method: 'POST'});
    }

    /* ── Final panel ── */
    function openFinal() {
        document.getElementById('final-panel').classList.add('open');
    }

    function closeFinal() {
        document.getElementById('final-panel').classList.remove('open');
    }

    /* ── Render ── */
    function render(data) {
        document.getElementById('round-label').textContent = `TOUR ${data.round} / 8`;
        document.getElementById('score-label').textContent = `${data.current_score} pts`;

        /* Message bar */
        const msgEl = document.getElementById('msg');
        const cfgs = {
            pick_card: ['c-gold', '✦ Choisissez une carte à jouer'],
            pick_center: ['c-purple', '✦ Choisissez une carte dans le centre'],
            pick_sanctuary: ['c-green', '✦ Choisissez un sanctuaire'],
            ai_thinking: ['c-blue', 'Les adversaires réfléchissent'],
            finished: ['c-green', '✦ Fin du voyage — consultez les résultats'],
        };
        const [cls, txt] = cfgs[data.phase] || ['c-blue', ''];
        msgEl.className = cls;
        msgEl.innerHTML = txt + (data.phase === 'ai_thinking' ? '<span class="thinking"></span>' : '');

        /* Opponents */
        const oppEl = document.getElementById('opponents');
        oppEl.innerHTML = '';
        (data.players || []).forEach(p => {
            if (p.name === data.human_name) return;
            oppEl.innerHTML += `<div class="opp">
      <div class="opp-name">
        ${p.name}
        <span style="color:var(--muted);font-size:10px">
          ${p.total_score > 0 ? p.total_score + 'pts' : p.hand_count + ' cartes'}
        </span>
      </div>
      ${p.sanctuaries.length ? `<div class="mini-row" style="margin-top:3px;opacity:.65">${p.sanctuaries.map(minisanctuariesHTML).join('')}</div>` : ''}
      <div class="mini-row">${p.played_cards.map(miniHTML).join('')}</div>
    </div>`;
        });

        /* My tableau */

        const me = (data.players || []).find(p => p.name === data.human_name);
        if (me) {
            const tab = document.getElementById('my-tableau');
            if (me.played_cards.length === 0) {
                tab.innerHTML = '<span class="t-empty">Vos cartes apparaîtront ici…</span>';
                tab.classList.remove('cards-grid');
            } else {
                tab.innerHTML = me.played_cards.map(c => `<div>${cardHTML(c, '', '')}</div>`).join('');
                tab.classList.add('cards-grid');
            }

            /* Sanctuaires */
            const sr = document.getElementById('my-sanct-row');
            const se = document.getElementById('my-sanctuaries');
            if (me.sanctuaries.length > 0) {
                sr.style.display = 'block';
                se.innerHTML = me.sanctuaries.map(c =>
                    `<div style="width:66px;height:92px;">${cardHTML(c, '', '')}</div>`
                ).join('');
            } else {
                sr.style.display = 'none';
            }
        }

        /* Center */
        const isPick = data.phase === 'pick_center';
        const ce = document.getElementById('center-cards');
        ce.innerHTML = (data.center || []).length
            ? (data.center || []).map(c =>
                `<div style="width:109pxpx;height:109px;">
          ${cardHTML(c, isPick ? 'c-pick' : '', isPick ? 'pickCenter' : '')}
        </div>`).join('')
            : '<span style="color:var(--muted);font-style:italic;font-size:12px">Centre vide</span>';

        /* Sanctuaries to pick */
        const sz = document.getElementById('sanct-zone');
        const sce = document.getElementById('sanct-cards');
        if (data.phase === 'pick_sanctuary' && (data.sanctuaries_drawn || []).length > 0) {
            sz.style.display = 'block';
            sce.innerHTML = (data.sanctuaries_drawn || []).map(c =>
                `<div style="width:78px;height:109px;">${cardHTML(c, 's-pick', 'pickSanctuary')}</div>`).join('');
        } else {
            sz.style.display = 'none';
        }

        /* Hand */
        const he = document.getElementById('hand-cards');
        he.innerHTML = (data.hand || []).map(c =>
            `<div style="width:123px;height:123px;">
      ${cardHTML(c, data.phase === 'pick_card' ? 'playable' : '', data.phase === 'pick_card' ? 'playCard' : '')}
    </div>`).join('');

        /* Final */
        if (data.phase === 'finished' && lastPhase !== 'finished') {
            buildFinal(data);
            document.getElementById('btn-show-final').classList.add('visible');
            openFinal();
        }

        lastPhase = data.phase;
    }

    function buildFinal(data) {
        /* Podium */
        const scores = Object.entries(data.scores || {}).sort((a, b) => b[1] - a[1]);
        const best = scores[0]?.[1];
        const ranks = ['🥇', '🥈', '🥉'];
        document.getElementById('podium').innerHTML = scores.map(([name, sc], i) =>
            `<div class="pod ${sc === best ? 'gold-pod' : ''}">
      <div class="pod-rank">${ranks[i] || '#' + (i + 1)}</div>
      <div class="pod-name">${name}</div>
      <div class="pod-score">${sc} pts</div>
    </div>`).join('');

        /* Player blocks with 4×2 grid */
        const container = document.getElementById('fp-players');
        container.innerHTML = '';

        (data.players || []).forEach(p => {
            const isWinner = (data.scores[p.name] === best);
            const score = data.scores[p.name] ?? 0;

            /* Sanctuaries */
            const sanctHTML = p.sanctuaries.length
                ? `<div class="fp-sanct-lbl">✦ Sanctuaires</div>
         <div class="fp-sanct-row">
           ${p.sanctuaries.map(c =>
                    `<div style="width:62px;height:87px;">${cardHTML(c, '', '')}</div>`
                ).join('')}
         </div>`
                : '';

            /* 4×2 grid — pad to 8 slots */
            const cards = [...p.played_cards];
            while (cards.length < 8) cards.push(null);
            const gridHTML = cards.map(c => c
                ? `<div class="card" style="aspect-ratio:4/4;">
           <img src="/card_image/${c.id}" alt="${c.id}"
                onerror="this.style.background='#2a2318';this.removeAttribute('src')">
           ${c.score != null ? `<div class="cscore">${c.score} pts</div>` : ''}
           ${tip(c)}
         </div>`
                : `<div style="aspect-ratio:3/4;background:rgba(255,255,255,.03);border:1px dashed var(--border);border-radius:5px;"></div>`
            ).join('');

            container.innerHTML += `
      <div class="fp-player ${isWinner ? 'fp-winner' : ''}">
        <div class="fp-player-hd">
          <span class="pname">${isWinner ? '🏆 ' : ''}${p.name}</span>
          <span class="pscore">${score} pts</span>
        </div>
        <div class="fp-body">
          ${sanctHTML}
          <div class="cards-grid">${gridHTML}</div>
        </div>
      </div>`;
        });
    }

    /* ── Poll ── */
    async function poll() {
        try {
            const data = await fetch('/api/state').then(r => r.json());
            render(data);
        } catch (e) {
            console.error(e);
        }
        setTimeout(poll, 650);
    }

    poll();
</script>
</body>
</html>
